<style>
:root{--night:#141a2e;--dusk:#222b48;--dusk-2:#2c375c;--line:#3b4772;--ink:#ece6d6;--muted:#a9a6b8;--gold:#e3b04b;--gold-ink:#2a1f05;--ok:#8fd4a0;--danger:#ef7a6a;

main{max-width:640px;margin:0 auto;padding-block:32px 48px;padding-inline:16px;display:grid;gap:20px}

.card{background:var(--dusk);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}

<main>
  <div>
    <h1>デプロイ</h1>
    <p>土地・資材・城・ドラゴンの4つのコントラクトをデプロイし、連携まで設定します。MetaMaskで承認が7回表示されます。Polygonでは、League of Kingdoms のDrago保有者が相棒ドラゴンを受け取れるように設定されます（Dragoは読み取るだけです）。</p>
  </div>

  <section class="card">
    <label for="net">ネットワーク
      <select id="net">
        <option value="137">Polygon（Drago連動・OpenSeaに表示・手数料は少額のPOL）</option>
        <option value="11155111">Sepolia テストネット（無料・動作確認用・Drago連動なし）</option>
        <option value="8453">Base（OpenSeaに表示・ETHの実費あり・Drago連動なし）</option>
      </select>
    </label>
    <button id="go" class="primary">ウォレットを接続してデプロイ開始</button>
    <p id="msg" class="msg"></p>
  </section>

  <section class="card">
    <ol id="steps"></ol>
  </section>

  <section class="card" id="result" hidden>
    <p>完了しました。この設定をゲームの <code>CONFIG</code> に貼り付けます。</p>
    <pre id="config"></pre>
    <button id="copy">コピー</button>
  </section>
</main>

const LOK_DRAGO = "0x9e8ea82e76262e957d4cc24e04857a34b0d8f062"; // League of Kingdoms Drago [Polygon]・読み取りのみ
const NETS = {
  137:      { name: "Polygon", currency: "POL", land: "1",     dragon: "2",     partner: LOK_DRAGO },
  11155111: { name: "Sepolia", currency: "ETH", land: "0.001", dragon: "0.002", partner: ethers.ZeroAddress },
  8453:     { name: "Base",    currency: "ETH", land: "0.001", dragon: "0.002", partner: ethers.ZeroAddress },
};
let NET;
const STEPS = [
  { key: "land", label: "土地コントラクトをデプロイ", run: async c => deploy("KingdomLand", [ethers.parseEther(NET.land)]) },
  { key: "res", label: "資材コントラクトをデプロイ", run: async c => deploy("KingdomResources", [c.land]) },
  { key: "castle", label: "城コントラクトをデプロイ", run: async c => deploy("KingdomCastle", [c.land, c.res]) },
  { key: "dragon", label: "ドラゴンコントラクトをデプロイ", run: async c => deploy("KingdomDragon", [c.land, c.res, ethers.parseEther(NET.dragon), NET.partner]) },
  { key: "w1", label: "資材に城を登録（生産ボーナス）", run: async c => call(c.res, "setCastle", [c.castle]) },
  { key: "w2", label: "城に資材の消費を許可", run: async c => call(c.res, "setGame", [c.castle, true]) },
  { key: "w3", label: "ドラゴンに資材の消費を許可", run: async c => call(c.res, "setGame", [c.dragon, true]) },
];
let signer, done = {};
const $ = id => document.getElementById(id);

function load(chain) { try { return JSON.parse(localStorage.getItem("dk-deploy-" + chain)) || {}; } catch { return {}; } }
function save(chain) { try { localStorage.setItem("dk-deploy-" + chain, JSON.stringify(done)); } catch {} }

function draw(active, failed) {
  $("steps").innerHTML = STEPS.map((s, i) => {
    const cls = done[s.key] ? "done" : i === active ? (failed ? "fail" : "run") : "";
    const addr = typeof done[s.key] === "string" && done[s.key].startsWith("0x") && done[s.key].length === 42 ? `<small>${done[s.key]}</small>` : "";
    return `<li class="${cls}"><span class="st"></span><span>${s.label}${addr}</span></li>`;
  }).join("");
}

async function deploy(name, args) {
  const f = new ethers.ContractFactory(ART[name].abi, ART[name].bytecode, signer);
  const c = await f.deploy(...args);
  $("msg").textContent = "ブロックの確定を待っています…";
  await c.waitForDeployment();
  return await c.getAddress();
}
async function call(addr, fn, args) {
  const c = new ethers.Contract(addr, ART.KingdomResources.abi, signer);
  const tx = await c[fn](...args);
  $("msg").textContent = "ブロックの確定を待っています…";
  await tx.wait();
  return true;
}

$("go").addEventListener("click", async () => {
  const msg = $("msg"); msg.className = "msg";
  if (!window.ethereum) { msg.className = "msg err"; msg.textContent = "MetaMaskが見つかりません。MetaMaskを入れたChromeで開いてください。"; return; }
  const chainId = Number($("net").value); NET = NETS[chainId];
  $("go").disabled = true; $("net").disabled = true;
  try {
    try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x" + chainId.toString(16) }] }); } catch {}
    const provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    if (Number((await provider.getNetwork()).chainId) !== chainId) throw new Error(`MetaMaskを ${NET.name} に切り替えてください。`);
    done = load(chainId);
    for (let i = 0; i < STEPS.length; i++) {
      const s = STEPS[i];
      if (done[s.key]) continue;
      draw(i); msg.textContent = `MetaMaskで承認してください（${i + 1}/${STEPS.length}）`;
      try { done[s.key] = await s.run(done); save(chainId); }
      catch (e) { draw(i, true); throw e; }
    }
    draw(-1);
    msg.textContent = "すべて完了しました。";
    $("config").textContent =
`const CONFIG = {
  LAND_ADDRESS:      "${done.land}",
  RESOURCES_ADDRESS: "${done.res}",
  CASTLE_ADDRESS:    "${done.castle}",
  DRAGON_ADDRESS:    "${done.dragon}",
  CHAIN_ID: ${chainId},
  CHAIN_NAME: "${NET.name}",
  CURRENCY: "${NET.currency}",
  PARTNER_ADDRESS:   "${NET.partner}",
};`;
    $("result").hidden = false;
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = (e?.code === "ACTION_REJECTED" || e?.code === 4001)
      ? "承認が取り消されました。もう一度押すと、続きから再開します。"
      : (e?.shortMessage || e?.message || "失敗しました") + "（もう一度押すと続きから再開します）";
    $("go").disabled = false; $("net").disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("config").textContent); $("copy").textContent = "コピーしました"; }
  catch { const r = document.createRange(); r.selectNodeContents($("config")); getSelection().removeAllRanges(); getSelection().addRange(r); }
});
draw(-1);
</script>
</body>
</html>
