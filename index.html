<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドラゴンキングダム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D map; one floating ledger panel (right on desktop, bottom sheet on phones) */
:root{
  --night:#141a2e;
  --dusk:#222b48;
  --dusk-2:#2c375c;
  --line:#3b4772;
  --ink:#ece6d6;
  --muted:#a9a6b8;
  --gold:#e3b04b;
  --gold-ink:#2a1f05;
  --danger:#ef7a6a;
  --ok:#8fd4a0;
  --r-food:#b9d46a; --r-wood:#c99d6e; --r-stone:#b8bccb; --r-gold:#f0c45a;
  --f-display:"Marcellus","Times New Roman",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block}

.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:linear-gradient(var(--night),transparent)}
.brand{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-size:.68rem;color:var(--muted);letter-spacing:.12em}
.chip{font-size:.72rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--dusk);white-space:nowrap}
.chip.live{color:var(--ok);border-color:var(--ok)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--dusk-2);color:var(--ink);padding:8px 12px;font-size:.85rem}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button .cost{display:block;font-weight:400;font-size:.72rem;opacity:.85;margin-top:2px}

.panel{position:fixed;z-index:6;right:16px;top:80px;width:350px;max-height:calc(100% - 100px);overflow:auto;
  background:color-mix(in srgb,var(--dusk) 95%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--dusk);z-index:1}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.sec{padding:14px 16px;display:grid;gap:12px}
.sec + .sec{border-top:1px solid var(--line)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res div{background:var(--dusk-2);border-radius:8px;padding:7px 8px;min-width:0}
.res b{display:block;font-family:var(--f-mono);font-size:.95rem;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.res span{font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.counts{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.counts b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.85rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.8rem}
.hint{color:var(--muted);font-size:.8rem;line-height:1.6;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.dragon{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--dusk-2);border-radius:10px;padding:10px 12px}
.dragon .el{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#1a1a22;grid-row:span 2}
.dragon .name{font-weight:700;font-size:.9rem}
.dragon .meta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dragon .row{grid-column:1/-1;margin-top:6px}
.dragon .row button{padding:6px 8px;font-size:.78rem}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}
.speed{font-size:.7rem;color:var(--muted)}
.partner{display:grid;gap:10px;padding:12px;border:1px solid var(--gold);border-radius:10px;background:color-mix(in srgb,var(--gold) 8%,var(--dusk))}
.field{display:grid;gap:6px;font-size:.8rem;color:var(--muted)}
.field input{font:inherit;font-family:var(--f-mono);font-size:.9rem;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--night);color:var(--ink)}
.field input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.badge{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--gold);color:var(--gold-ink);vertical-align:2px}

.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  background:var(--dusk-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:.85rem;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--danger);color:var(--danger)}


.tabs button{padding:12px 4px;font-size:.82rem}
.monster{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--dusk))}
.monster small{display:block;color:var(--muted);font-size:.72rem}
.kingdom{display:flex;gap:12px;align-items:center;justify-content:space-between}
.kingdom > div:first-child{flex:1;min-width:0}
.xp{height:6px;border-radius:999px;background:var(--dusk-2);overflow:hidden;margin:6px 0}
.xp i{display:block;height:100%;background:var(--gold)}
.coins{text-align:right}.coins b{display:block;font-family:var(--f-mono);font-size:1.3rem;color:var(--gold)}.coins span{font-size:.7rem;color:var(--muted)}
h2 small{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.troops,.quests{display:grid;gap:8px}
.troop,.quest{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--dusk-2);border-radius:10px;padding:8px 10px}
.troop small,.quest small{display:block;color:var(--muted);font-size:.72rem}
.troop .row{flex:none;flex-wrap:nowrap}.troop .row button{padding:6px 10px}
.quest.got{opacity:.6}
.tablewrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.rank th{color:var(--muted);font-weight:400;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.rank td{padding:7px 4px;border-bottom:1px solid var(--line)}
.rank tr.me td{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,20,.6);display:grid;place-items:center;padding:16px}
.b-card{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--dusk);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.b-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.close{border:0;background:none;font-size:1.4rem;line-height:1;padding:2px 8px;color:var(--muted)}
.label{margin:0;font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.picks{display:grid;gap:6px}
.pick{text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pick small{flex-basis:100%;color:var(--muted);font-size:.72rem}
.pick.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--dusk-2))}
.slider{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:8px;align-items:center;font-size:.82rem}
.slider input{width:100%;accent-color:var(--gold)}
.slider output{font-family:var(--f-mono);font-size:.78rem;text-align:right}
.rate{display:flex;justify-content:space-between;align-items:baseline}
.rate b{font-family:var(--f-mono);font-size:1.4rem}
.good{color:var(--ok)}.bad{color:var(--danger)}
b.good{font-size:.7rem}
.hpbar{position:relative;height:22px;border-radius:6px;background:var(--dusk-2);overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--danger);transition:width .4s}
.hpbar span{position:relative;display:block;text-align:center;font-family:var(--f-mono);font-size:.75rem;line-height:22px}
.log{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.log b{color:var(--ink);font-weight:500}
.result{border-radius:10px;padding:10px 12px}.result h2{font-size:1.4rem}.result p{margin:4px 0 0;font-size:.85rem}
.result.win{background:color-mix(in srgb,var(--ok) 16%,var(--dusk))}.result.lose{background:color-mix(in srgb,var(--danger) 14%,var(--dusk))}
.stage{position:relative;height:230px;margin-inline:-16px;overflow:hidden;background:linear-gradient(#2c3866,#161c33)}
.stage canvas{display:block}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-weight:700;font-size:1.15rem;pointer-events:none;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.7);animation:pop 1s ease-out forwards}
.pop.hit{color:#fff1a8}.pop.hurt{color:#ff8a7a}.pop.loss{font-size:.75rem;color:#ffd0c8}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
@media (max-width:720px){
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:50%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .toast{bottom:calc(50% + 12px)}
  .brand{font-size:1.1rem}
}
</style>
</head><body style="margin:0">

<div id="scene" aria-label="王国の3Dマップ"></div>

<header class="bar">
  <div class="brand">ドラゴンキングダム<small>LAND · CASTLE · DRAGON · RESOURCES</small></div>
  <span id="mode" class="chip">デモ</span>
  <button id="connect" class="primary">ウォレット接続</button>
</header>

<aside class="panel">
  <div class="tabs" role="tablist">
    <button id="tab-land" role="tab" data-tab="land" aria-selected="true">土地</button>
    <button id="tab-dragon" role="tab" data-tab="dragon" aria-selected="false">ドラゴン</button>
    <button id="tab-quest" role="tab" data-tab="quest" aria-selected="false">冒険</button>
    <button id="tab-rank" role="tab" data-tab="rank" aria-selected="false">ランキング</button>
  </div>
  <div class="sec">
    <div class="res" id="res"></div>
    <div class="counts"><span>所有地 <b id="c-land">0</b></span><span>城 <b id="c-castle">0</b></span><span>ドラゴン <b id="c-dragon">0</b></span></div>
    <button id="harvest" class="primary" data-act="harvest">すべて収穫</button>
    <p id="speed" class="speed"></p>
  </div>
  <div id="view-land" class="sec"></div>
  <div id="view-dragon" class="sec" hidden></div>
  <div id="view-quest" class="sec" hidden></div>
  <div id="view-rank" class="sec" hidden></div>
</aside>

<div id="battle" class="modal" hidden><div class="b-card" role="dialog" aria-modal="true" aria-label="討伐"></div></div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script>
/* ===================== 設定 =====================
 * デプロイ後、4つのアドレスをここに貼り付けてください。 */
const CONFIG = {
  LAND_ADDRESS:      "0x7A0A90Cd743209e3dA825a42319f9f9a210158B8",
  RESOURCES_ADDRESS: "0x52a20DC13806B05B370271f350d12404F88E055A",
  CASTLE_ADDRESS:    "0xE96381ecfEBF04CD63DEbfD3081395Edc451CCf5",
  DRAGON_ADDRESS:    "0x6f6B3e8E1fa02D8CAf2A85B1e026c5e771dAA157",
  CHAIN_ID: 137,
  CHAIN_NAME: "Polygon",
  CURRENCY: "POL",
  PARTNER_ADDRESS:   "0x9e8ea82e76262e957d4cc24e04857a34b0d8f062",
};

/* ===================== ルール（コントラクトと同じ値） ===================== */
const SIZE = 20, TOTAL = SIZE * SIZE, ZERO = "0x0000000000000000000000000000000000000000";
const MAX_STORE = 24 * 3600, COOLDOWN = 3600, MAX_LEVEL = 10;
const BUILD_COST = [0, 500, 500, 0];
const upgradeCost = c => [300 * c, 600 * c, 600 * c, 50 * c];
const HATCH_FOOD = 300, TRAIN_FOOD = lv => 100 * lv;
const STARTER = [1000, 1000, 1000, 100];
const RES = [
  { name: "食料", css: "--r-food" }, { name: "木材", css: "--r-wood" },
  { name: "石材", css: "--r-stone" }, { name: "金", css: "--r-gold" },
];
const TERRAIN = [
  { name: "草原", color: 0x6f9a4f, h: 0.30 }, { name: "森", color: 0x3f6b3c, h: 0.38 },
  { name: "山", color: 0x7c7a86, h: 0.55 },   { name: "砂漠", color: 0xcfae6e, h: 0.26 },
];
const ELEMENTS = [
  { name: "炎", color: "#ee6a3a" }, { name: "氷", color: "#86d6f2" },
  { name: "雷", color: "#f3d143" }, { name: "闇", color: "#9a73d4" },
];
const hasEthers = typeof window.ethers !== "undefined";
function terrainOf(id) {
  if (hasEthers) return Number(BigInt(ethers.solidityPackedKeccak256(["string", "uint256"], ["terrain", id])) % 4n);
  let h = 2166136261 ^ id; h = Math.imul(h ^ (h >>> 13), 16777619); return Math.abs(h) % 4;
}
const TER = Array.from({ length: TOTAL }, (_, i) => terrainOf(i));
const ratePerHour = id => Math.floor((TER[id] === 3 ? 20 : 100) * (2 + (state.levels[id] || 0)) / 2);
function pending(id) {
  const t = state.last[id]; if (!t) return 0;
  const dt = Math.min(MAX_STORE, Math.max(0, state.backend.now() - t));
  return Math.floor(ratePerHour(id) * dt / 3600);
}
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const num = n => Number(n).toLocaleString("ja-JP");
const costText = c => c.map((v, i) => v ? `${RES[i].name}${num(v)}` : "").filter(Boolean).join("・");
const canPay = c => c.every((v, i) => state.balances[i] >= v);

/* ===================== デモ用バックエンド（時間60倍速） ===================== */
function makeDemo() {
  const SPEED = 60, t0 = Date.now() / 1000, now = () => Math.floor(t0 + (Date.now() / 1000 - t0) * SPEED);
  const me = "0xDe0000000000000000000000000000000000Ae01";
  const others = ["0xA11ce0000000000000000000000000000000B0b1", "0xC4a7100000000000000000000000000000005e11", "0x7e5a000000000000000000000000000000009a1d"];
  const owners = Array(TOTAL).fill(ZERO), levels = Array(TOTAL).fill(0), last = Array(TOTAL).fill(0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 40; i++) { const id = Math.floor(rnd() * TOTAL); owners[id] = others[i % 3]; if (rnd() < .6) levels[id] = 1 + Math.floor(rnd() * 6); }
  // 自分の土地：中央付近で4種類の地形を1つずつ
  const mine = [];
  for (let t = 0; t < 4; t++) for (let r = 0; r < 6 && mine.length === t; r++)
    for (let y = 9 - r; y <= 10 + r && mine.length === t; y++) for (let x = 9 - r; x <= 10 + r; x++) {
      const id = y * SIZE + x; if (TER[id] === t && owners[id] === ZERO && !mine.includes(id)) { mine.push(id); break; }
    }
  mine.forEach(id => { owners[id] = me; last[id] = now() - 3 * 3600; });
  levels[mine[0]] = 2;
  const bal = [1450, 820, 640, 90];
  const dragons = [{ owner: me, element: 0, power: 112, level: 3, landId: mine[0], lastTrained: 0 }];
  owners.forEach((o, id) => { if (o !== ZERO && o !== me && rnd() < .35) dragons.push({ owner: o, element: Math.floor(rnd() * 4), power: 50 + Math.floor(rnd() * 100), level: 1 + Math.floor(rnd() * 6), landId: id, lastTrained: 0 }); });
  const wait = () => new Promise(r => setTimeout(r, 400));
  const claimedP = new Set();
  const spend = c => { if (!c.every((v, i) => bal[i] >= v)) throw new Error("insufficient balance"); c.forEach((v, i) => bal[i] -= v); };
  const settle = id => { const t = last[id]; if (t) { const lv = levels[id], dt = Math.min(MAX_STORE, now() - t); bal[TER[id]] += Math.floor((TER[id] === 3 ? 20 : 100) * (2 + lv) / 2 * dt / 3600); } last[id] = now(); };
  return {
    kind: "demo", account: me, now, focus: mine[0], speed: SPEED,
    async load() { return { owners: owners.slice(), levels: levels.slice(), last: last.slice(), balances: bal.slice(), starter: true, landPrice: "1", dragonPrice: "2", dragons: dragons.map((d, id) => ({ ...d, id })) }; },
    async mintLand(x, y) { await wait(); const id = y * SIZE + x; if (owners[id] !== ZERO) throw new Error("already owned"); owners[id] = me; },
    async harvest(ids) { await wait(); ids.forEach(settle); },
    async build(id) { await wait(); if (levels[id]) throw new Error("castle exists"); settle(id); spend(BUILD_COST); levels[id] = 1; },
    async upgrade(id) { await wait(); if (levels[id] >= MAX_LEVEL) throw new Error("max level"); settle(id); spend(upgradeCost(levels[id])); levels[id]++; },
    async hatch(id) { await wait(); if (owners[id] !== me) throw new Error("not your land"); spend([HATCH_FOOD, 0, 0, 0]);
      dragons.push({ owner: me, element: Math.floor(Math.random() * 4), power: 50 + Math.floor(Math.random() * 100), level: 1, landId: id, lastTrained: 0 }); },
    async moveTo(i, id) { await wait(); dragons[i].landId = id; },
    partnerEnabled: true,
    async checkPartner(tid) { await wait(); return { owner: tid === 38517 ? me : others[0], claimed: claimedP.has(tid) }; },
    async claimPartner(tid, id) { await wait(); if (tid !== 38517) throw new Error("not partner holder"); if (claimedP.has(tid)) throw new Error("partner already claimed");
      if (owners[id] !== me) throw new Error("not your land"); claimedP.add(tid);
      dragons.push({ owner: me, element: Math.floor(Math.random() * 4), power: 100 + Math.floor(Math.random() * 50), level: 5, landId: id, lastTrained: 0, partner: true }); },
    async train(i) { await wait(); const d = dragons[i]; if (now() < d.lastTrained + COOLDOWN) throw new Error("dragon is resting");
      spend([TRAIN_FOOD(d.level), 0, 0, 0]); d.lastTrained = now(); d.level++; },
  };
}

/* ===================== ブロックチェーン用バックエンド ===================== */
const ABI = {
  land: ["function landPrice() view returns (uint256)", "function mintLand(uint256 x, uint256 y) payable returns (uint256)", "function allOwners() view returns (address[])"],
  res: ["function harvest(uint256[] landIds)", "function allLastHarvest() view returns (uint64[400])",
        "function balanceOfBatch(address[] accounts, uint256[] ids) view returns (uint256[])", "function starterClaimed(address) view returns (bool)"],
  castle: ["function build(uint256 landId)", "function upgrade(uint256 landId)", "function allLevels() view returns (uint8[400])"],
  dragon: ["function dragonPrice() view returns (uint256)", "function hatch(uint256 landId) payable returns (uint256)",
           "function moveTo(uint256 dragonId, uint256 landId)", "function train(uint256 dragonId)",
           "function claimPartner(uint256 partnerTokenId, uint256 landId) returns (uint256)", "function partnerClaimed(uint256) view returns (bool)",
           "function allDragons() view returns (address[] owners, tuple(uint8 element, uint16 power, uint16 level, uint32 landId, uint64 lastTrained, bool partner)[] list)"],
  partner: ["function ownerOf(uint256 tokenId) view returns (address)"],
};

async function makeChain() {
  if (!window.ethereum) throw new Error("NO_WALLET");
  if (CONFIG.LAND_ADDRESS === ZERO) throw new Error("NO_CONFIG");
  try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x" + CONFIG.CHAIN_ID.toString(16) }] }); } catch (e) {}
  const provider = new ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner();
  if (Number((await provider.getNetwork()).chainId) !== CONFIG.CHAIN_ID) throw new Error("WRONG_CHAIN");
  const c = (a, abi) => new ethers.Contract(a, abi, signer);
  const land = c(CONFIG.LAND_ADDRESS, ABI.land), res = c(CONFIG.RESOURCES_ADDRESS, ABI.res);
  const castle = c(CONFIG.CASTLE_ADDRESS, ABI.castle), dragon = c(CONFIG.DRAGON_ADDRESS, ABI.dragon);
  const account = await signer.getAddress();
  const send = async p => { const tx = await p; toast("ブロックの確定を待っています…"); await tx.wait(); };
  let lp = 0n, dp = 0n;
  return {
    kind: "chain", account, now: () => Math.floor(Date.now() / 1000),
    async load() {
      const [owners, levels, last, bals, starter, all, l, d] = await Promise.all([
        land.allOwners(), castle.allLevels(), res.allLastHarvest(), res.balanceOfBatch(Array(4).fill(account), [0, 1, 2, 3]),
        res.starterClaimed(account), dragon.allDragons(), land.landPrice(), dragon.dragonPrice()]);
      lp = l; dp = d;
      return {
        owners: [...owners], levels: [...levels].map(Number), last: [...last].map(Number), balances: [...bals].map(Number), starter,
        landPrice: ethers.formatEther(l), dragonPrice: ethers.formatEther(d),
        dragons: all.list.map((x, id) => ({ id, owner: all.owners[id], element: Number(x.element), power: Number(x.power), level: Number(x.level), landId: Number(x.landId), lastTrained: Number(x.lastTrained), partner: x.partner })),
      };
    },
    mintLand: (x, y) => send(land.mintLand(x, y, { value: lp })),
    harvest: ids => send(res.harvest(ids)),
    build: id => send(castle.build(id)),
    upgrade: id => send(castle.upgrade(id)),
    hatch: id => send(dragon.hatch(id, { value: dp })),
    moveTo: (i, id) => send(dragon.moveTo(i, id)),
    train: i => send(dragon.train(i)),
    partnerEnabled: CONFIG.PARTNER_ADDRESS !== ZERO,
    async checkPartner(tid) {
      const p = c(CONFIG.PARTNER_ADDRESS, ABI.partner);
      const [owner, claimed] = await Promise.all([p.ownerOf(tid).catch(() => ZERO), dragon.partnerClaimed(tid)]);
      return { owner, claimed };
    },
    claimPartner: (tid, id) => send(dragon.claimPartner(tid, id)),
  };
}

/* ===================== 冒険（ブラウザ内のゲーム） =====================
 * 討伐・兵士・クエストの進行はこのブラウザに保存されます（ウォレットごと）。
 * ドラゴンのパワー・レベル・属性と城のレベルは、ブロックチェーン上のNFTをそのまま使います。 */
const TROOPS = {
  inf: { name: "歩兵", atk: 3, hp: 10, cost: 2, sec: 1.5 },
  arc: { name: "弓兵", atk: 5, hp: 6,  cost: 3, sec: 2 },
  cav: { name: "騎兵", atk: 7, hp: 12, cost: 5, sec: 3 },
};
const MONSTER_TYPES = [
  { name: "ゴブリン",   color: 0x8fbf5a, weak: "arc", scale: .8 },
  { name: "オーガ",     color: 0xb06a4a, weak: "cav", scale: 1.1 },
  { name: "大蜘蛛",     color: 0x5a4a72, weak: "inf", scale: 1 },
  { name: "ゴーレム",   color: 0x9a968a, weak: "cav", scale: 1.15 },
  { name: "ワイバーン", color: 0x4f9a96, weak: "arc", scale: 1 },
];
const QUESTS = [
  { id: "kill3",   text: "魔物を3体倒す",          key: "kill",    goal: 3,  reward: 100 },
  { id: "strong",  text: "Lv5以上の魔物を倒す",    key: "strong",  goal: 1,  reward: 150 },
  { id: "train20", text: "兵士を20人訓練する",     key: "train",   goal: 20, reward: 80 },
  { id: "harvest", text: "土地から資材を収穫する", key: "harvest", goal: 1,  reward: 50 },
  { id: "chest",   text: "宝箱を見つける",         key: "chest",   goal: 1,  reward: 120 },
];
const STAMINA_MAX = 3, STAMINA_SEC = 15 * 60, MONSTER_COUNT = 10, MAX_ROUNDS = 8, RESPAWN_SEC = 20;
const beats = (a, b) => (a + 1) % 4 === b;                 // 炎>氷>雷>闇>炎
const kLevelOf = exp => { let n = 1; while (exp >= 30 * n * (n + 1)) n++; return n; };
const monsterStats = L => ({ hp: Math.round(150 * Math.pow(L, 1.4)), atk: 15 * L });
const jstDay = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const speedUp = () => state.backend?.speed || 1;

let G = null, gameKey = null, lastSpawn = 0, battle = null;

function newGame() {
  return { coins: 200, exp: 0, kills: 0, troops: { inf: 30, arc: 0, cav: 0 }, queue: [], stamina: {},
           quest: { day: jstDay(), prog: {}, claimed: {} }, monsters: [], seq: 0 };
}
function loadGame() {
  if (!state.backend || !state.account || !state.owners.length) return;
  const key = `dk-game-${state.backend.kind}-${state.account.toLowerCase()}`;
  if (key === gameKey) return;
  gameKey = key;
  try { G = JSON.parse(localStorage.getItem(key)); } catch (e) { G = null; }
  if (!G || !G.troops) G = newGame();
  G.monsters = (G.monsters || []).filter(m => state.owners[m.tile] === ZERO);
  spawnMonsters(true); drawMonsters();
}
function saveGame() { try { localStorage.setItem(gameKey, JSON.stringify(G)); } catch (e) {} }
function quest() {
  if (G.quest.day !== jstDay()) G.quest = { day: jstDay(), prog: {}, claimed: {} };
  return G.quest;
}
function questProg(key, n) { if (!G) return; const q = quest(); q.prog[key] = (q.prog[key] || 0) + n; saveGame(); }

const kLevel = () => kLevelOf(G.exp);
const myCastleTotal = () => myLands().reduce((a, id) => a + (state.levels[id] || 0), 0);
const troopCap = () => 60 + 20 * kLevel() + 15 * myCastleTotal();
const troopCount = () => Object.values(G.troops).reduce((a, b) => a + b, 0) + G.queue.reduce((a, q) => a + q.n, 0);

/* ---- スタミナ（ドラゴン1頭あたり3回、15分で1回復） ---- */
function stamina(id) {
  const per = STAMINA_SEC * 1000 / speedUp(), s = G.stamina[id];
  if (!s) return { v: STAMINA_MAX, next: 0 };
  const el = Date.now() - s.t, v = Math.min(STAMINA_MAX, s.v + Math.floor(el / per));
  return { v, next: v >= STAMINA_MAX ? 0 : Math.ceil((per - el % per) / 1000) };
}
function useStamina(id) {
  const per = STAMINA_SEC * 1000 / speedUp(), s = G.stamina[id], cur = stamina(id).v;
  const t = (!s || cur >= STAMINA_MAX) ? Date.now() : s.t + Math.floor((Date.now() - s.t) / per) * per;
  G.stamina[id] = { v: cur - 1, t };
}

/* ---- 魔物の出現 ---- */
function spawnMonsters(fill) {
  const free = [];
  state.owners.forEach((o, i) => { if (o === ZERO && !G.monsters.some(m => m.tile === i)) free.push(i); });
  const maxL = Math.min(10, kLevel() + 2);
  let added = false;
  while (G.monsters.length < MONSTER_COUNT && free.length && (fill || Date.now() - lastSpawn > RESPAWN_SEC * 1000)) {
    const tile = free.splice(Math.floor(Math.random() * free.length), 1)[0];
    const lvl = 1 + Math.floor(Math.pow(Math.random(), 1.3) * maxL);
    G.monsters.push({ id: ++G.seq, tile, type: Math.floor(Math.random() * MONSTER_TYPES.length), el: Math.floor(Math.random() * 4), lvl });
    lastSpawn = Date.now(); added = true;
    if (!fill) break;
  }
  if (added) saveGame();
  return added;
}
const monsterGroup = new THREE.Group(); scene.add(monsterGroup);
function makeMonster(m) {
  const T = MONSTER_TYPES[m.type], g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color: T.color });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff }), dark = new THREE.MeshBasicMaterial({ color: 0x111111 });
  let body;
  if (m.type === 3) { body = new THREE.Mesh(new THREE.BoxGeometry(.3, .32, .24), mat); body.position.y = .2; }
  else if (m.type === 2) { body = new THREE.Mesh(new THREE.SphereGeometry(.16, 10, 8), mat); body.scale.set(1.2, .7, 1.2); body.position.y = .14;
    for (let i = 0; i < 4; i++) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .3, 4), mat); const a = i * Math.PI / 2 + Math.PI / 4; leg.position.set(Math.cos(a) * .16, .1, Math.sin(a) * .16); leg.rotation.z = Math.cos(a) * .8; leg.rotation.x = -Math.sin(a) * .8; g.add(leg); } }
  else { body = new THREE.Mesh(new THREE.SphereGeometry(.15, 10, 8), mat); body.scale.y = 1.15; body.position.y = .18; }
  g.add(body);
  [-1, 1].forEach(s => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.035, 6, 6), white); e.position.set(.06 * s, body.position.y + .05, .13); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.018, 6, 6), dark); p.position.set(.06 * s, body.position.y + .05, .16); g.add(p);
  });
  if (m.type === 1) [-1, 1].forEach(s => { const h = new THREE.Mesh(new THREE.ConeGeometry(.03, .1, 5), white); h.position.set(.08 * s, .36, 0); g.add(h); });
  if (m.type === 4) [-1, 1].forEach(s => { const w = new THREE.Mesh(new THREE.ConeGeometry(.1, .3, 3), mat); w.rotation.z = s * Math.PI / 2; w.position.set(.2 * s, .24, 0); g.add(w); g.userData.wing = g.userData.wing || []; g.userData.wing.push({ w, s }); });
  const aura = new THREE.Mesh(new THREE.RingGeometry(.22, .27, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(ELEMENTS[m.el].color), side: THREE.DoubleSide, transparent: true, opacity: .8 }));
  aura.rotation.x = -Math.PI / 2; aura.position.y = .01; g.add(aura);
  g.scale.setScalar(T.scale * (.85 + m.lvl * .05));
  const p = tilePos(m.tile); g.position.set(p.x + .1, TERRAIN[TER[m.tile]].h, p.z + .1);
  g.userData.m = m; g.userData.baseY = g.position.y; g.userData.phase = m.id;

}
function drawMonsters() { monsterGroup.clear(); if (G) G.monsters.forEach(m => monsterGroup.add(makeMonster(m))); }
function animateMonsters(t) {
  monsterGroup.children.forEach(g => {
    g.position.y = g.userData.baseY + Math.abs(Math.sin(t * 2.4 + g.userData.phase)) * .06;
    g.rotation.y = Math.sin(t * .8 + g.userData.phase) * .6;
    (g.userData.wing || []).forEach(({ w, s }) => w.rotation.x = Math.sin(t * 9 + g.userData.phase) * .5 * s);
  });
}
const monsterAt = tile => G?.monsters.find(m => m.tile === tile);

/* ---- 戦闘 ---- */
function dragonAtk(d, m) {
  if (!d) return 0;
  let a = d.power * (1 + .15 * (d.level - 1)) * .6;
  if (beats(d.element, m.el)) a *= 1.5; else if (beats(m.el, d.element)) a *= .75;
  return a;
}
function simulate(m, d, sent, rnd = Math.random) {
  const st = monsterStats(m.lvl), alive = { ...sent }, lost = { inf: 0, arc: 0, cav: 0 }, log = [];
  const weak = MONSTER_TYPES[m.type].weak, dA = dragonAtk(d, m);
  let mhp = st.hp;
  for (let r = 1; r <= MAX_ROUNDS; r++) {
    let atk = dA;
    for (const k in TROOPS) atk += alive[k] * TROOPS[k].atk * (k === weak ? 1.5 : 1);
    const pd = Math.round(atk * (.85 + rnd() * .3));
    mhp = Math.max(0, mhp - pd);
    const kill = { inf: 0, arc: 0, cav: 0 }; let md = 0;
    if (mhp > 0) {
      md = Math.round(st.atk * (.85 + rnd() * .3));
      const toTroops = d ? md * .5 : md;   // ドラゴンが半分を受け止める
      const total = Object.keys(TROOPS).reduce((a, k) => a + alive[k] * TROOPS[k].hp, 0);
      if (total > 0) for (const k in TROOPS) {
        const share = alive[k] * TROOPS[k].hp / total;
        const n = Math.min(alive[k], Math.floor(toTroops * share / TROOPS[k].hp + rnd()));
        alive[k] -= n; lost[k] += n; kill[k] = n;
      }
    }
    log.push({ r, pd, md, mhp, kill });
    if (mhp <= 0) break;
    if (!d && Object.values(alive).every(v => v === 0)) break;
  }
  return { win: mhp <= 0, log, lost, hp0: st.hp };
}
function winRate(m, d, sent) { let w = 0; for (let i = 0; i < 300; i++) if (simulate(m, d, sent).win) w++; return Math.round(w / 3); }

function openBattle(m) {
  const mine = state.dragons.filter(d => isMine(d.owner));
  const ready = mine.filter(d => stamina(d.id).v > 0).sort((a, b) => dragonAtk(b, m) - dragonAtk(a, m));
  battle = { m, dragonId: ready[0]?.id ?? -1, sent: { ...G.troops }, phase: "setup" };
  renderBattle();
}
function battleHead() {
  const { m } = battle, T = MONSTER_TYPES[m.type], st = monsterStats(m.lvl), E = ELEMENTS[m.el];
  return `<div class="b-head"><div><h2>${E.name}の${T.name} <small>Lv ${m.lvl}</small></h2>
    <p class="hint">HP ${num(st.hp)} · 攻撃 ${st.atk} · 弱点：${TROOPS[T.weak].name}・${ELEMENTS[(m.el + 3) % 4].name}属性のドラゴン</p></div>
    <button class="close" data-b="close" aria-label="閉じる">×</button></div>`;
}
function renderBattle() {
  const box = document.getElementById("battle");
  if (!battle) { box.hidden = true; stageStop(); return; }
  box.hidden = false;
  if (battle.phase !== "setup") return;
  const { m } = battle, T = MONSTER_TYPES[m.type];
  const d = state.dragons[battle.dragonId];
  const mine = state.dragons.filter(x => isMine(x.owner));
  const opts = mine.map(x => { const s = stamina(x.id), e = ELEMENTS[x.element];
    const tag = beats(x.element, m.el) ? "有利" : beats(m.el, x.element) ? "不利" : "";
    return `<button class="pick ${x.id === battle.dragonId ? "on" : ""}" data-b="dragon" data-id="${x.id}" ${s.v ? "" : "disabled"}>
      <i class="dot" style="background:${e.color}"></i>${e.name} #${x.id} Lv${x.level}
      <small>攻撃 ${Math.round(dragonAtk(x, m))}${tag ? `・${tag}` : ""}・スタミナ ${s.v}/${STAMINA_MAX}</small></button>`; }).join("");
  const sliders = Object.entries(TROOPS).map(([k, t]) => `
    <label class="slider" for="s-${k}"><span>${t.name}${k === T.weak ? " <b class=\"good\">弱点</b>" : ""}</span>
      <input id="s-${k}" type="range" min="0" max="${G.troops[k]}" value="${battle.sent[k]}" data-k="${k}">
      <output>${battle.sent[k]} / ${G.troops[k]}</output></label>`).join("");
  const any = (d ? 1 : 0) + Object.values(battle.sent).reduce((a, b) => a + b, 0);
  const rate = any ? winRate(m, d, battle.sent) : 0;
  box.querySelector(".b-card").innerHTML = battleHead() + `<p class="label">出撃するドラゴン</p><div class="picks">${opts}
      <button class="pick ${battle.dragonId === -1 ? "on" : ""}" data-b="dragon" data-id="-1">ドラゴンなし<small>兵士だけで戦う</small></button></div>
    <p class="label">兵士</p>${sliders}
    <div class="rate"><span>勝率の目安</span><b class="${rate >= 70 ? "good" : rate >= 40 ? "" : "bad"}">${rate}%</b></div>
    <button class="primary" data-b="go" ${any ? "" : "disabled"}>出撃する</button>`;
}
function startBattle() {
  const { m } = battle, d = state.dragons[battle.dragonId];
  if (d) useStamina(d.id);
  const r = simulate(m, d, battle.sent);
  for (const k in TROOPS) G.troops[k] -= r.lost[k];
  const rw = {};
  if (r.win) {
    const before = kLevel();
    rw.coins = 15 * m.lvl + Math.floor(Math.random() * 10 * m.lvl); rw.exp = 12 * m.lvl;
    if (m.lvl >= 4 && Math.random() < .3) { rw.chest = 40 * m.lvl; questProg("chest", 1); }
    G.coins += rw.coins + (rw.chest || 0); G.exp += rw.exp; G.kills++;
    questProg("kill", 1); if (m.lvl >= 5) questProg("strong", 1);
    G.monsters = G.monsters.filter(x => x.id !== m.id); lastSpawn = Date.now();
    if (kLevel() > before) rw.levelUp = kLevel();
  }
  saveGame();
  Object.assign(battle, { phase: "fight", result: r, reward: rw });
  const card = document.querySelector("#battle .b-card");
  card.innerHTML = battleHead() + `<div class="stage" id="stage"></div>
    <div class="hpbar"><i id="b-hp" style="width:100%"></i><span id="b-hpt">${num(r.hp0)} / ${num(r.hp0)}</span></div>
    <ol class="log" id="b-log"></ol><div id="b-end"></div>`;
  // 戦闘演出は、OSの「視差効果を減らす」設定がオンでも再生する（揺れと点滅だけ控えめにする）
  stageStart(document.getElementById("stage"), m, d, battle.sent);
  const me = battle;
  let i = 0;
  const next = () => {
    if (battle !== me) return;
    const l = r.log[i], last = i === r.log.length - 1;
    const onHit = () => {
      const hp = document.getElementById("b-hp"); if (!hp) return;
      hp.style.width = `${Math.max(0, l.mhp / r.hp0 * 100)}%`;
      document.getElementById("b-hpt").textContent = `${num(l.mhp)} / ${num(r.hp0)}`;
      const li = document.createElement("li");
      li.innerHTML = `<b>${l.r}回戦</b> 与えたダメージ ${num(l.pd)}${l.md ? `・受けたダメージ ${num(l.md)}` : ""}${Object.entries(l.kill).filter(([, n]) => n).map(([k, n]) => `・${TROOPS[k].name}-${n}`).join("")}`;
      document.getElementById("b-log").appendChild(li);
    };
    const dur = stageRound(l, last, r.win, onHit);
    i++;
    setTimeout(last ? finish : next, dur);
  };
  const finish = () => {
    if (battle !== me) return;
    battle.phase = "done";
    document.getElementById("b-end").innerHTML = (r.win
      ? `<div class="result win"><h2>勝利！</h2><p>コイン +${rw.coins}・経験値 +${rw.exp}${rw.chest ? `・宝箱からコイン +${rw.chest}` : ""}</p>${rw.levelUp ? `<p>王国がLv${rw.levelUp}になりました</p>` : ""}</div>`
      : `<div class="result lose"><h2>撤退</h2><p>${MAX_ROUNDS}回戦で倒しきれませんでした。兵士を増やすか、有利な属性のドラゴンで挑みましょう。</p></div>`)
      + `<p class="hint">失った兵士：${Object.entries(r.lost).map(([k, n]) => `${TROOPS[k].name}${n}`).join("・")}</p><button class="primary" data-b="close">閉じる</button>`;
    drawMonsters(); render();
  };
  setTimeout(next, 450);
}
/* ===================== 戦闘アニメーション（3D） ===================== */
const UNIT_SHOW = 10;   // 兵種ごとに表示する最大人数
const B3 = { r: null, raf: 0, tweens: [], parts: [], units: [], now: 0 };

function makeUnit(k) {
  const g = new THREE.Group(), L = c => new THREE.MeshLambertMaterial({ color: c });
  const skin = L(0xe8c39e);
  if (k === "cav") {
    const horse = new THREE.Mesh(new THREE.BoxGeometry(.2, .09, .07), L(0x7a5232)); horse.position.y = .12; g.add(horse);
    const neck = new THREE.Mesh(new THREE.BoxGeometry(.05, .1, .05), L(0x7a5232)); neck.position.set(.1, .18, 0); neck.rotation.z = -.5; g.add(neck);
    [[-.07, -.025], [-.07, .025], [.07, -.025], [.07, .025]].forEach(([x, z]) => { const l = new THREE.Mesh(new THREE.BoxGeometry(.02, .09, .02), L(0x5a3a22)); l.position.set(x, .04, z); g.add(l); });
    const rider = new THREE.Mesh(new THREE.BoxGeometry(.06, .1, .05), L(0xb8433a)); rider.position.y = .22; g.add(rider);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.028, 8, 6), skin); head.position.y = .3; g.add(head);
    const lance = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, .3, 4), L(0xd9d2c3)); lance.rotation.z = -1.3; lance.position.set(.12, .24, .04); g.add(lance);
  } else {
    const body = new THREE.Mesh(new THREE.BoxGeometry(.07, .12, .05), L(k === "inf" ? 0x6f82b8 : 0x5f8f4e)); body.position.y = .1; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), skin); head.position.y = .19; g.add(head);
    if (k === "inf") {
      const spear = new THREE.Mesh(new THREE.CylinderGeometry(.005, .005, .26, 4), L(0xd9d2c3)); spear.position.set(.05, .14, 0); g.add(spear);
      const shield = new THREE.Mesh(new THREE.BoxGeometry(.015, .08, .06), L(0xc9a24b)); shield.position.set(.045, .1, 0); g.add(shield);
    } else {
      const bow = new THREE.Mesh(new THREE.TorusGeometry(.06, .006, 4, 10, Math.PI), L(0x8a5a2b)); bow.rotation.z = -Math.PI / 2; bow.position.set(.05, .12, 0); g.add(bow);
    }
  }
  return g;
}

function stageStart(el, m, d, sent) {
  stageStop();
  const w = el.clientWidth || 360, h = 230;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(w, h); el.prepend(r.domElement);
  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, w / h, .1, 50); cam.position.set(0, 1.6, 4.2); cam.lookAt(0, .45, 0);
  sc.add(new THREE.HemisphereLight(0xdfe6ff, 0x30281c, .85));
  const sunL = new THREE.DirectionalLight(0xffe2b0, .8); sunL.position.set(-3, 5, 4); sc.add(sunL);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(3.2, 40), new THREE.MeshLambertMaterial({ color: TERRAIN[TER[m.tile]].color }));
  ground.rotation.x = -Math.PI / 2; sc.add(ground);

  // 魔物
  const mon = makeMonster(m); mon.position.set(1.35, 0, 0); mon.rotation.y = -Math.PI / 2;
  mon.scale.multiplyScalar(2.6); mon.userData.home = mon.position.clone(); sc.add(mon);
  // ドラゴン
  let dra = null;
  if (d) { dra = makeDragon(d.element, d.level); dra.scale.multiplyScalar(1.5); dra.rotation.y = Math.PI / 2; dra.position.set(-1.7, 1.05, 0); dra.userData.home = dra.position.clone(); sc.add(dra); }
  // 兵士
  const rows = { cav: -.35, inf: -.7, arc: -1.05 }, units = [];
  for (const k in TROOPS) {
    const show = Math.min(UNIT_SHOW, sent[k]); if (!show) continue;
    for (let i = 0; i < show; i++) {
      const u = makeUnit(k), z = (i - (show - 1) / 2) * .16, x = rows[k] + (i % 2) * .08;
      u.position.set(x, 0, z); u.userData = { k, home: u.position.clone(), alive: true }; sc.add(u); units.push(u);
    }
  }
  Object.assign(B3, { r, sc, cam, el, mon, dra, d, units, sent: { ...sent }, alive: { ...sent }, tweens: [], parts: [], now: performance.now(), m });
  const loop = t => {
    B3.raf = requestAnimationFrame(loop);
    const dt = Math.min(50, t - B3.now); B3.now = t;
    B3.tweens = B3.tweens.filter(tw => { const p = (t - tw.t0) / tw.dur; if (p < 0) return true; tw.fn(Math.min(1, p)); if (p >= 1) { tw.done?.(); return false; } return true; });
    B3.parts = B3.parts.filter(pt => { pt.life -= dt; pt.mesh.position.addScaledVector(pt.v, dt / 1000); pt.v.y -= (pt.g || 0) * dt / 1000;
      pt.mesh.material.opacity = Math.max(0, pt.life / pt.max); if (pt.life <= 0) { sc.remove(pt.mesh); return false; } return true; });
    const s = t / 1000;
    if (dra && !dra.userData.busy) dra.position.y = dra.userData.home.y + Math.sin(s * 2.2) * .07;
    if (dra) dra.userData.wings.forEach(w => w.pivot.rotation.z = w.s * Math.sin(s * 9) * .6);
    if (!mon.userData.busy && !mon.userData.dead) mon.position.y = Math.abs(Math.sin(s * 2.4)) * .05;
    r.render(sc, cam);
  };
  B3.raf = requestAnimationFrame(loop);
}
function stageStop() {
  cancelAnimationFrame(B3.raf);
  if (B3.r) { B3.r.dispose(); B3.r.domElement.remove(); }
  B3.el?.querySelectorAll(".pop").forEach(p => p.remove());
  Object.assign(B3, { r: null, tweens: [], parts: [], units: [] });
}
const tween = (delay, dur, fn, done) => B3.tweens.push({ t0: performance.now() + delay, dur, fn, done });
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

function popText(pos3, text, cls) {
  if (!B3.r) return;
  const v = pos3.clone().project(B3.cam), el = document.createElement("div");
  el.className = "pop " + (cls || ""); el.textContent = text;
  el.style.left = `${(v.x + 1) / 2 * B3.el.clientWidth}px`; el.style.top = `${(1 - v.y) / 2 * 230}px`;
  B3.el.appendChild(el); setTimeout(() => el.remove(), 1100);
}
function burst(from, to, color, n, spread, life, size) {
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size || .04, 6, 4), new THREE.MeshBasicMaterial({ color, transparent: true }));
    mesh.position.copy(from);
    const dir = to ? to.clone().sub(from).multiplyScalar(1 / (life / 1000)) : new THREE.Vector3();
    dir.add(new THREE.Vector3((Math.random() - .5) * spread, (Math.random() - .5) * spread, (Math.random() - .5) * spread));
    const delay = to ? i * 12 : 0;
    setTimeout(() => { if (!B3.r) return; B3.sc.add(mesh); B3.parts.push({ mesh, v: dir, life, max: life, g: to ? 0 : 2 }); }, delay);
  }
}
function flash(obj, color) {
  if (still) return;
  const mats = []; obj.traverse(o => { if (o.material && o.material.emissive) mats.push(o.material); });
  mats.forEach(mt => mt.emissive.setHex(color));
  setTimeout(() => mats.forEach(mt => mt.emissive.setHex(0)), 160);
}

/* 1回戦ぶんの演出。所要時間(ms)を返す */
function stageRound(l, last, win, onHit) {
  if (!B3.r) { onHit(); return 200; }
  const { mon, dra, units, m } = B3, monPos = mon.userData.home.clone().add(new THREE.Vector3(0, .45, 0));
  const living = units.filter(u => u.userData.alive);
  // 兵士の突撃
  living.forEach(u => { const hx = u.userData.home.x, reach = u.userData.k === "arc" ? .08 : .35;
    tween(Math.random() * 80, 420, p => u.position.x = hx + Math.sin(p * Math.PI) * reach); });
  // 矢
  living.filter(u => u.userData.k === "arc").forEach((u, i) => {
    const arrow = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, .14, 4), new THREE.MeshBasicMaterial({ color: 0xf2e6c8 }));
    arrow.rotation.z = -Math.PI / 2; const a = u.position.clone().add(new THREE.Vector3(.05, .15, 0)), b = monPos.clone().add(new THREE.Vector3(0, 0, (Math.random() - .5) * .3));
    tween(120 + i * 25, 380, p => { if (!arrow.parent) B3.sc.add(arrow); arrow.position.lerpVectors(a, b, p); arrow.position.y += Math.sin(p * Math.PI) * .45; arrow.rotation.z = -Math.PI / 2 + (.5 - p) * 1.4; },
      () => B3.sc.remove(arrow));
  });
  // ドラゴンの急降下とブレス
  if (dra) {
    dra.userData.busy = true;
    const h = dra.userData.home, dive = new THREE.Vector3(-.2, .85, 0), col = new THREE.Color(ELEMENTS[B3.d.element].color);
    tween(100, 320, p => dra.position.lerpVectors(h, dive, ease(p)));
    tween(300, 10, () => burst(dive.clone().add(new THREE.Vector3(.45, .05, 0)), monPos, col, 26, .35, 300, .05));
    tween(620, 380, p => dra.position.lerpVectors(dive, h, ease(p)), () => dra.userData.busy = false);
  }
  // 命中
  tween(560, 10, () => {
    flash(mon, 0xff3b2f);
    popText(monPos.clone().add(new THREE.Vector3(0, .5, 0)), `-${num(l.pd)}`, "hit");
    burst(monPos, null, 0xfff1c0, 10, 1.6, 400, .03);
    onHit();
  });
  if (!still) tween(560, 260, p => { mon.userData.busy = true; mon.position.x = mon.userData.home.x + Math.sin(p * Math.PI * 6) * .06 * (1 - p); }, () => mon.userData.busy = false);

  let dur = 1250;
  if (l.mhp <= 0) {
    // 撃破
    mon.userData.dead = true;
    const s0 = mon.scale.clone();
    tween(820, 700, p => { mon.rotation.z = -p * Math.PI / 2; mon.position.y = -p * .1; mon.scale.copy(s0).multiplyScalar(1 - p * .7); });
    tween(1300, 10, () => { B3.sc.remove(mon); burst(monPos, null, 0xe3b04b, 40, 3, 900, .035); });
    dur = 2100;
  } else if (l.md) {
    // 魔物の反撃
    tween(820, 380, p => { mon.userData.busy = true; mon.position.x = mon.userData.home.x - Math.sin(p * Math.PI) * .75; }, () => mon.userData.busy = false);
    tween(1000, 10, () => {
      const front = new THREE.Vector3(-.35, .4, 0);
      popText(front.clone().add(new THREE.Vector3(0, .35, 0)), `-${num(l.md)}`, "hurt");
      // 倒れた兵士を表示に反映
      for (const k in TROOPS) {
        B3.alive[k] -= l.kill[k];
        const showAlive = B3.sent[k] ? Math.ceil(B3.alive[k] / B3.sent[k] * Math.min(UNIT_SHOW, B3.sent[k])) : 0;
        const list = B3.units.filter(u => u.userData.k === k && u.userData.alive);
        list.slice(showAlive).forEach(u => { u.userData.alive = false;
          tween(0, 450, p => { u.rotation.z = p * Math.PI / 2; u.position.y = -p * .04; }, () => setTimeout(() => B3.sc?.remove(u), 400)); });
      }
      const lost = Object.entries(l.kill).filter(([, n]) => n).map(([k, n]) => `${TROOPS[k].name}-${n}`).join(" ");
      if (lost) popText(front.clone().add(new THREE.Vector3(-.4, .05, 0)), lost, "loss");
      if (dra) flash(dra, 0x662211);
    });
    dur = 1550;
  }
  if (last && !win) {
    // 撤退
    tween(dur, 600, p => units.forEach(u => { if (u.userData.alive) { u.rotation.y = Math.PI; u.position.x = u.userData.home.x - p * .8; } }));
    if (dra) tween(dur, 600, p => dra.position.x = dra.userData.home.x - p * 1.2);
    dur += 700;
  }
  if (last && win) {
    tween(dur - 200, 10, () => burst(new THREE.Vector3(-.6, .2, 0), null, 0xe3b04b, 30, 2.4, 1000, .03));
    living.forEach(u => tween(dur - 200 + Math.random() * 200, 500, p => u.position.y = Math.abs(Math.sin(p * Math.PI * 2)) * .12));
  }
  return dur;
}

document.getElementById("battle").addEventListener("click", e => {
  const b = e.target.closest("[data-b]"); if (!b) { if (e.target.id === "battle" && battle?.phase !== "fight") { battle = null; renderBattle(); } return; }
  if (b.dataset.b === "close") { battle = null; renderBattle(); }
  if (b.dataset.b === "dragon") { battle.dragonId = Number(b.dataset.id); renderBattle(); }
  if (b.dataset.b === "go") startBattle();
});
document.getElementById("battle").addEventListener("input", e => {
  const k = e.target.dataset.k; if (!k) return;
  battle.sent[k] = Number(e.target.value);
  e.target.nextElementSibling.textContent = `${battle.sent[k]} / ${G.troops[k]}`;

});
addEventListener("keydown", e => { if (e.key === "Escape" && battle && battle.phase !== "fight") { battle = null; renderBattle(); } });

/* ---- 兵士の訓練 ---- */
function trainTroops(k, n) {
  const t = TROOPS[k], room = troopCap() - troopCount();
  n = Math.min(n, room, Math.floor(G.coins / t.cost));
  if (n <= 0) return toast(room <= 0 ? "兵舎がいっぱいです。王国レベルや城のレベルを上げると増えます。" : "コインが足りません。魔物を倒すかクエストで集めましょう。", true);
  const start = Math.max(Date.now(), G.queue.length ? G.queue[G.queue.length - 1].doneAt : 0);
  G.coins -= n * t.cost;
  G.queue.push({ k, n, doneAt: start + n * t.sec * 1000 / speedUp() });
  saveGame(); render(); toast(`${t.name}${n}人の訓練を始めました`);
}
function gameTick() {
  if (!G) return;
  let changed = false;
  while (G.queue.length && G.queue[0].doneAt <= Date.now()) {
    const q = G.queue.shift(); G.troops[q.k] += q.n; questProg("train", q.n); changed = true;
    toast(`${TROOPS[q.k].name}${q.n}人の訓練が終わりました`);
  }
  if (spawnMonsters(false)) { drawMonsters(); changed = true; }
  if (changed) { saveGame(); if (!battle) render(); }
  const qs = document.getElementById("queue-status");
  if (qs) qs.textContent = queueText();
  document.querySelectorAll("[data-st]").forEach(el => { const s = stamina(+el.dataset.st); el.textContent = `${s.v}/${STAMINA_MAX}${s.next ? `（あと${fmt(s.next)}で回復）` : ""}`; });
}
function queueText() {
  if (!G.queue.length) return "訓練中の兵士はいません";
  const q = G.queue[0], left = Math.max(0, Math.ceil((q.doneAt - Date.now()) / 1000));
  return `${TROOPS[q.k].name}${q.n}人を訓練中・あと${fmt(left)}${G.queue.length > 1 ? `（ほか${G.queue.length - 1}件待ち）` : ""}`;
}

/* ---- 冒険タブ ---- */
function renderAdventure() {
  const V = document.getElementById("view-quest");
  if (!G) { V.innerHTML = `<p class="hint">読み込み中…</p>`; return; }
  const lv = kLevel(), lo = 30 * (lv - 1) * lv, hi = 30 * lv * (lv + 1), q = quest();
  const mine = state.dragons.filter(d => isMine(d.owner));
  V.innerHTML = `
    <div class="kingdom">
      <div><h2>王国 Lv ${lv}</h2><div class="xp"><i style="width:${(G.exp - lo) / (hi - lo) * 100}%"></i></div>
        <p class="hint">経験値 ${num(G.exp)} / ${num(hi)}・討伐数 ${num(G.kills)}</p></div>
      <div class="coins"><b>${num(G.coins)}</b><span>コイン</span></div>
    </div>
    <p class="hint">マップ上の魔物をタップすると討伐に出られます。今いる魔物：${G.monsters.length}体</p>

    <h2>兵士 <small>${troopCount()} / ${troopCap()}</small></h2>
    <div class="troops">${Object.entries(TROOPS).map(([k, t]) => `
      <div class="troop"><div><b>${t.name}</b> <span class="mono">${G.troops[k]}</span>
        <small>攻撃${t.atk}・HP${t.hp}・1人${t.cost}コイン</small></div>
        <div class="row"><button data-act="troop" data-k="${k}" data-n="5">+5</button><button data-act="troop" data-k="${k}" data-n="20">+20</button></div></div>`).join("")}
    </div>
    <p class="hint" id="queue-status">${queueText()}</p>
    <p class="hint">兵舎の上限は、王国レベルと城のレベルの合計で増えます。</p>

    <h2>ドラゴンのスタミナ</h2>
    ${mine.length ? `<dl class="kv">${mine.map(d => `<dt>${ELEMENTS[d.element].name} #${d.id} Lv${d.level}</dt><dd data-st="${d.id}"></dd>`).join("")}</dl>`
      : `<p class="hint">ドラゴンがいなくても兵士だけで戦えますが、ドラゴンがいるとずっと強くなります。</p>`}

    <h2>今日のクエスト</h2>
    <div class="quests">${QUESTS.map(Q => { const p = Math.min(Q.goal, q.prog[Q.key] || 0), done = p >= Q.goal, got = q.claimed[Q.id];
      return `<div class="quest ${got ? "got" : ""}"><div><b>${Q.text}</b><small>${p} / ${Q.goal}・報酬 ${Q.reward}コイン</small></div>
        <button data-act="claim" data-q="${Q.id}" ${done && !got ? "class=\"primary\"" : "disabled"}>${got ? "受取済" : "受け取る"}</button></div>`; }).join("")}
    </div>
    <p class="hint">クエストは毎日0時（日本時間）に新しくなります。冒険の記録はこのブラウザに保存され、NFTには記録されません。</p>`;
}

/* ---- ランキング（ブロックチェーン上のデータで全プレイヤーを集計） ---- */
function renderRank() {
  const V = document.getElementById("view-rank"), score = {};
  const add = (a, k, v) => { if (a === ZERO) return; const key = a.toLowerCase(); score[key] = score[key] || { addr: a, lands: 0, castle: 0, dragon: 0 }; score[key][k] += v; };
  state.owners.forEach((o, i) => { add(o, "lands", 1); add(o, "castle", state.levels[i] || 0); });
  state.dragons.forEach(d => add(d.owner, "dragon", d.power * d.level));
  const rows = Object.values(score).map(s => ({ ...s, total: s.lands * 10 + s.castle * 30 + Math.round(s.dragon / 10) })).sort((a, b) => b.total - a.total);
  const meIdx = rows.findIndex(r => isMine(r.addr));
  const line = (r, i) => `<tr class="${isMine(r.addr) ? "me" : ""}"><td>${i + 1}</td><td class="mono">${isMine(r.addr) ? "あなた" : short(r.addr)}</td><td>${r.lands}</td><td>${r.castle}</td><td><b>${num(r.total)}</b></td></tr>`;
  V.innerHTML = `<h2>王国の戦力ランキング</h2>
    <p class="hint">ブロックチェーン上のNFTから全プレイヤーを集計しています。戦力＝土地×10＋城レベル合計×30＋ドラゴン（パワー×レベル）÷10</p>
    <div class="tablewrap"><table class="rank"><thead><tr><th>順位</th><th>王国</th><th>土地</th><th>城Lv</th><th>戦力</th></tr></thead>
    <tbody>${rows.slice(0, 10).map(line).join("")}${meIdx >= 10 ? line(rows[meIdx], meIdx) : ""}</tbody></table></div>
    ${rows.length ? "" : `<p class="hint">まだ誰も土地を持っていません。</p>`}
    ${G ? `<p class="hint">あなたの討伐数：${num(G.kills)}体（このブラウザの記録）</p>` : ""}`;
}

/* ===================== 操作 ===================== */
let toastTimer;
function toast(msg, err) {
  const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 5000 : 3000);
}
const ERRORS = {
  "already owned": "この区画はすでに誰かが所有しています。",
  "not your land": "自分の土地でしか操作できません。",
  "not your dragon": "自分のドラゴンではありません。",
  "castle exists": "この区画にはすでに城があります。",
  "not partner holder": "このDragoの持ち主ではありません。接続中のウォレットで持っているDragoのIDを入力してください。",
  "partner already claimed": "このDragoの相棒ドラゴンは受け取り済みです。",
  "partner disabled": "このネットワークでは相棒ドラゴンは使えません。",
  "max level": "城は最大レベルです。",
  "dragon is resting": "ドラゴンは休憩中です。時間をおいて訓練してください。",
  "insufficient balance": "資材が足りません。土地から収穫してください。",
  "ERC1155InsufficientBalance": "資材が足りません。土地から収穫してください。",
  "not enough ETH": "支払い額が足りません。",
  "insufficient funds": "ウォレットのETHが足りません。",
};
function explain(e) {
  if (e?.code === "ACTION_REJECTED" || e?.code === 4001) return "ウォレットで取り消されました。";
  const msg = [e?.reason, e?.shortMessage, e?.revert?.name, e?.message].filter(Boolean).join(" ");
  for (const k in ERRORS) if (msg.includes(k)) return ERRORS[k];
  return "処理に失敗しました：" + msg.slice(0, 120);
}
async function run(fn, done) {
  if (state.busy) return;
  state.busy = true; render();
  try { if (state.backend.kind === "chain") toast("ウォレットで承認してください"); await fn(); await refresh(); toast(done); }
  catch (e) { toast(explain(e), true); }
  finally { state.busy = false; render(); }
}

document.querySelector(".panel").addEventListener("input", e => { if (e.target.id === "partner-id") state.partnerInput = e.target.value; });
document.querySelector(".panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { state.tab = b.dataset.tab; return render(); }
  const act = b.dataset.act, id = Number(b.dataset.id), s = state.selected, B = state.backend;
  if (act === "harvest") run(async () => { await B.harvest(myLands()); questProg("harvest", 1); }, "収穫しました");
  if (act === "fight") { const m = monsterAt(s); if (m) openBattle(m); }
  if (act === "troop") trainTroops(b.dataset.k, Number(b.dataset.n));
  if (act === "claim") { const Q = QUESTS.find(q => q.id === b.dataset.q), q = quest();
    if (Q && !q.claimed[Q.id] && (q.prog[Q.key] || 0) >= Q.goal) { q.claimed[Q.id] = true; G.coins += Q.reward; saveGame(); render(); toast(`クエスト達成：${Q.reward}コインを受け取りました`); } }
  if (act === "mint") run(() => B.mintLand(s % SIZE, Math.floor(s / SIZE)), "土地を手に入れました");
  if (act === "build") run(() => B.build(s), "城が完成しました");
  if (act === "upgrade") run(() => B.upgrade(s), `城がLv${state.levels[s] + 1}になりました`);
  if (act === "hatch") run(() => B.hatch(s), "ドラゴンが孵化しました");
  if (act === "train") run(() => B.train(id), "訓練でレベルが上がりました");
  if (act === "move") run(() => B.moveTo(id, s), "ドラゴンが移動しました");
  if (act === "partner") {
    const tid = Number(state.partnerInput.trim());
    const target = (s !== null && isMine(state.owners[s])) ? s : myLands()[0];
    if (!Number.isInteger(tid) || tid < 0 || !state.partnerInput.trim()) return toast("DragoのトークンIDを数字で入力してください。", true);
    run(async () => {
      const chk = await B.checkPartner(tid);
      if (chk.claimed) throw new Error("partner already claimed");
      if (!isMine(chk.owner)) throw new Error("not partner holder");
      await B.claimPartner(tid, target);
      state.partnerInput = "";
    }, "相棒ドラゴンがやってきました");
  }
  if (act === "focus") { const d = state.dragons[id]; state.selected = d.landId; state.tab = "land"; const p = tilePos(d.landId); controls.target.set(p.x, 0, p.z); render(); }
});

document.getElementById("connect").addEventListener("click", async () => {
  try {
    const chain = await makeChain();
    state.backend = chain; state.account = chain.account; gameKey = null; battle = null; renderBattle();
    const m = document.getElementById("mode"); m.textContent = `${CONFIG.CHAIN_NAME} · ${short(chain.account)}`; m.classList.add("live");
    document.getElementById("connect").hidden = true;
    state.selected = null; await refresh(); toast("ウォレットに接続しました");
  } catch (e) {
    const m = { NO_WALLET: "ウォレットが見つかりません。MetaMaskを入れたブラウザで開いてください。今はデモで遊べます。",
      NO_CONFIG: "コントラクトのアドレスがまだ設定されていません。デプロイ後に設定してください。",
      WRONG_CHAIN: `ウォレットを ${CONFIG.CHAIN_NAME} ネットワークに切り替えてください。` }[e.message];
    toast(m || explain(e), true);
  }
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = { x: e.clientX, y: e.clientY });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const mHit = ray.intersectObjects(monsterGroup.children, true)[0];
  const hit = mHit ? null : ray.intersectObjects(tiles)[0];
  state.selected = mHit ? mHit.object.userData.tile : hit ? hit.object.userData.landId : null; state.tab = "land"; render();
});

function resize() { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock(); let tick = 0;
renderer.setAnimationLoop(() => {
  const t = still ? 0 : clock.getElapsedTime();
  dragonGroup.children.forEach(g => {
    const d = g.userData.d, p = tilePos(d.landId), a = t * .7 + g.userData.phase;
    g.position.set(p.x + Math.cos(a) * .9, 1.6 + Math.sin(t * 2 + g.userData.phase) * .12, p.z + Math.sin(a) * .9);
    g.rotation.y = -a;
    g.userData.wings.forEach(w => w.pivot.rotation.z = w.s * Math.sin(t * 8 + g.userData.phase) * .6);
  });
  animateMonsters(t);
  controls.update(); renderer.render(scene, camera);
  if (++tick % 30 === 0) { updateLive(); gameTick(); }
});

(async () => {
  const demo = makeDemo(); state.backend = demo; state.account = demo.account;
  await refresh(); state.selected = demo.focus; render();
  const p = tilePos(demo.focus); controls.target.set(p.x * .5, 0, p.z * .5);
})();
</script>
